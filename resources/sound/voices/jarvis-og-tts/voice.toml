[voice]
id = "jarvis-og-tts"
name = "Jarvis OG (Qwen)"
author = ""
languages = ["ru"]

[reactions.ru]
# app startup, generic
greet = ["run"]

# app startup, by time of day
greet_morning = ["greet_morning"]
greet_day = ["greet_day"]
greet_evening = ["greet_evening"]
greet_night = ["greet_night"]

# wake word detected
reply = ["reply1", "reply2", "reply3"]

# command executed
ok = ["ok1", "ok2", "ok3", "ok4"]

# waiting on the language model
thinking = ["thinking1", "thinking2", "thinking3"]

# command not found
not_found = ["not_found1", "not_found2"]

# thanks
thanks = ["thanks1", "thanks2"]

# error
error = ["error1", "error2"]

# goodbye
goodbye = ["goodbye1", "goodbye2"]

[voice]
id = "jarvis-og-tts"
name = "Jarvis OG (Qwen)"
author = ""
languages = ["ru"]

[reactions.ru]
# app startup, generic
greet = ["run"]

# app startup, by time of day
greet_morning = ["greet_morning"]
greet_day = ["greet_day"]
greet_evening = ["greet_evening"]
greet_night = ["greet_night"]

# wake word detected
reply = ["reply1", "reply2", "reply3"]

# command executed
ok = ["ok1", "ok2", "ok3", "ok4"]

# waiting on the language model
thinking = ["thinking1", "thinking2", "thinking3"]

# command not found
not_found = ["not_found1", "not_found2"]

# thanks
thanks = ["thanks1", "thanks2"]

# error
error = ["error1", "error2"]

# goodbye
goodbye = ["goodbye1", "goodbye2"]

# What each clip says.
#
# The text belongs beside the recording of it: without this the pack could not
# say what any of its own files contained. The console reads it to label the
# table and to know what to say when a clip is baked again, and the baking
# script reads the same table rather than a copy of its own.
[lines.ru]
run = "К вашим услугам, сэр."
greet_morning = "Доброе утро, сэр. Все системы в норме."
greet_day = "Добрый день, сэр."
greet_evening = "Добрый вечер, сэр."
greet_night = "Доброй ночи, сэр. Я не сплю."
reply1 = "Слушаю, сэр."
reply2 = "Да, сэр."
reply3 = "К вашим услугам."
ok1 = "Выполнено, сэр."
ok2 = "Готово."
ok3 = "Запрос выполнен, сэр."
ok4 = "Сделано."
thinking1 = "Думаю над ответом, сэр."
thinking2 = "Секунду, сэр."
thinking3 = "Работаю над запросом."
not_found1 = "Я не понял команду, сэр."
not_found2 = "Такой команды у меня нет."
thanks1 = "Всегда рад помочь, сэр."
thanks2 = "Не за что."
error1 = "Есть небольшая проблема, сэр."
error2 = "Команду выполнить не удалось."
goodbye1 = "До свидания, сэр."
goodbye2 = "Отключаюсь."

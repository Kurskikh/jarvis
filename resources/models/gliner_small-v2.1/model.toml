# Read by jarvis-core: models::catalog::scan_models() -> load_model_def()
#   `struct ModelToml { model: ModelDef }`  => everything lives under [model]
#   ModelDef: id (String), name (String), tasks (Vec<Task>), description (#[serde(default)])
#   Task is #[serde(rename_all = "snake_case")]: intent | slots | vad | noise_suppression | stt
#
# `path` is #[serde(skip)] - the scanner overwrites it with this directory,
# so no file names/paths belong in this file. models/loaders/gliner.rs resolves
# onnx/model.onnx (or model.onnx) and tokenizer.json itself, relative to it.
#
# The weights are NOT in version control (see .gitignore) - only this
# descriptor is. catalog::scan_models() checks the loader's required files
# before publishing the model, so until the weights are downloaded into this
# directory the id is not offered in the settings dropdown and cannot be
# stored. Drop the files in and it appears with no code change.
#
# `id` is the value stored in Settings.slots_backend: anything that is not
# "none" is passed to gliner::load() as a model id (slots.rs).

[model]
id = "gliner_small-v2.1"
name = "GLiNER small v2.1"
tasks = ["slots"]
description = "GLiNER small v2.1, ONNX. Zero-shot named entity recognition used to pull slot values (city, number, name, ...) out of a recognized command."

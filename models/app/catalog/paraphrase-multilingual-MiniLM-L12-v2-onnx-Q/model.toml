# Read by jarvis-core: models::catalog::scan_models() -> load_model_def()
#   `struct ModelToml { model: ModelDef }`  => everything lives under [model]
#   ModelDef: id (String), name (String), tasks (Vec<Task>), description (#[serde(default)])
#   Task is #[serde(rename_all = "snake_case")]: intent | slots | vad | noise_suppression | stt
#
# `path` is #[serde(skip)] - the scanner overwrites it with this directory,
# so no file names/paths belong in this file. models/loaders/embedding.rs
# resolves model.onnx, tokenizer.json, config.json, tokenizer_config.json and
# special_tokens_map.json itself, relative to this directory.
#
# `id` is the value stored in Settings.intent_backend: anything that is not
# "none" or "intent-classifier" is passed straight to embedding::load() as a
# model id (crates/jarvis-core/src/intent.rs:31-36).

[model]
id = "paraphrase-multilingual-MiniLM-L12-v2-onnx-Q"
name = "paraphrase-multilingual-MiniLM-L12-v2 (multilingual)"
tasks = ["intent"]
description = "Quantized ONNX port (Qdrant/fastembed) of sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2. Multilingual XLM-R-vocab sentence encoder, 12 layers, 384-dim embeddings, 50+ languages including Russian. Serves the embedding-based intent classifier."

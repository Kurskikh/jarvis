[package]
name = "jarvis-gui"
version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
edition.workspace = true

[dependencies]
# "llm" carries the OpenAI-compatible client and the speech sidecar client.
# The settings screen needs both to ask a server what models it has and to
# check whether the sidecar is up - and asking through the core keeps the
# offline-first gate in one place instead of a second copy in TypeScript.
# jarvis-app already enables this feature, and resolver 2 unifies features
# across a workspace build, so the core is not rebuilt for it.
jarvis-core = { path = "../jarvis-core", default-features = false, features = ["llm"] }
tauri = { version = "2", features = [] } # v1: "shell-open", "dialog-message", "path-all"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

peak_alloc = "0.3.0"
systemstat = "0.2"
lazy_static = "1.4"
sysinfo.workspace = true

once_cell.workspace = true
log.workspace = true
simple-log = "2.4"
serde.workspace = true
serde_json.workspace = true
platform-dirs.workspace = true
parking_lot.workspace = true

# command editor write side (crate::commands_editor)
toml.workspace = true
tempfile.workspace = true
chrono.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
